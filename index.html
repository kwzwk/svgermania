<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Funino-Wochenplaner</title>
  <meta name="description" content="Wochenpläne mit Funino-Übungen für G-, F- und E-Jugend, passend zu Alter und Niveau der Kinder.">
  <script>
    // Gespeichertes Farbschema vor dem ersten Zeichnen setzen, damit nichts aufblitzt.
    try { const t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <div class="header-top">
        <img class="logo" src="img/logo.svg" alt="Logo" onerror="this.remove()">
        <div class="titles">
          <h1 data-i18n="title">Funino-Wochenplaner</h1>
          <p class="tagline" data-i18n="tagline">Kinderfußball nach dem Prinzip Spielen – Üben – Spielen</p>
        </div>
        <div class="header-buttons">
          <button type="button" class="theme-toggle" id="lang-toggle">EN</button>
          <button type="button" class="theme-toggle" id="theme-toggle">Automatisch</button>
        </div>
      </div>
      <nav class="tabs" aria-label="Bereiche">
        <button class="tab" data-view="plan" aria-current="page" data-i18n="tabPlan">Wochenplan</button>
        <button class="tab" data-view="catalog" data-i18n="tabCatalog">Übungen</button>
        <button class="tab" data-view="rules" data-i18n="tabRules">Ablauf &amp; Regeln</button>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <section id="view-plan" class="view">
      <form id="plan-form" class="controls">
        <label><span data-i18n="age">Altersklasse</span>
          <select name="age" id="age"></select>
        </label>
        <fieldset class="levels">
          <legend data-i18n="level">Niveau</legend>
          <div id="levels" class="segmented"></div>
        </fieldset>
        <label><span data-i18n="sessions">Einheiten pro Woche</span>
          <select name="sessions">
            <option value="1">1</option>
            <option value="2" selected>2</option>
            <option value="3">3</option>
          </select>
        </label>
        <label><span data-i18n="minutes">Dauer (Minuten)</span>
          <select name="minutes" id="minutes"></select>
        </label>
        <label><span data-i18n="players">Anzahl Kinder</span>
          <input type="number" name="players" min="2" max="40" value="12">
        </label>
        <label><span data-i18n="theme">Schwerpunkt</span>
          <select name="theme" id="theme"></select>
        </label>
        <label><span data-i18n="week">Kalenderwoche</span>
          <input type="number" name="week" min="1" max="53">
        </label>
        <label class="check"><input type="checkbox" name="rituals" checked> <span data-i18n="includeRituals">Rituale einplanen</span></label>
        <div class="actions">
          <button type="button" id="shuffle" data-i18n="shuffle">Neu mischen</button>
          <button type="button" id="print" data-i18n="print">Drucken</button>
        </div>
      </form>
      <p id="level-hint" class="hint"></p>
      <div id="plan"></div>
      <div class="start-area">
        <label id="start-session-label"><span data-i18n="startWhich">Einheit</span>
          <select id="start-session"></select>
        </label>
        <button type="button" id="start-training" class="start-button" data-i18n="startTraining">▶ Training jetzt starten</button>
      </div>
    </section>

    <section id="view-catalog" class="view" hidden>
      <div class="controls compact">
        <label><span data-i18n="age">Altersklasse</span>
          <select id="cat-age"></select>
        </label>
        <label><span data-i18n="phase">Phase</span>
          <select id="cat-phase"></select>
        </label>
        <label><span data-i18n="theme">Schwerpunkt</span>
          <select id="cat-theme"></select>
        </label>
      </div>
      <p id="cat-count" class="hint"></p>
      <div id="catalog" class="catalog"></div>
    </section>

    <section id="view-rules" class="view" hidden>
      <div id="rules"></div>
    </section>
  </main>

  <div id="trainer" class="trainer" role="dialog" aria-modal="true" aria-label="Training" hidden></div>

  <footer class="site-footer wrap">
    <p data-i18n="footer">Grundlage: Horst Weins Funino und die DFB-Spielformen im Kinderfußball. Feldmaße sind Richtwerte.</p>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>

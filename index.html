<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Funino-Wochenplaner · SV Germania</title>
  <meta name="description" content="Wochenpläne mit Funino-Übungen für G-, F- und E-Jugend, passend zu Alter und Niveau der Kinder.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <h1>Funino-Wochenplaner</h1>
      <p class="tagline">SV Germania · Kinderfußball nach dem Prinzip Spielen – Üben – Spielen</p>
      <nav class="tabs" aria-label="Bereiche">
        <button class="tab" data-view="plan" aria-current="page">Wochenplan</button>
        <button class="tab" data-view="catalog">Übungen</button>
        <button class="tab" data-view="rules">Ablauf &amp; Regeln</button>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <section id="view-plan" class="view">
      <form id="plan-form" class="controls">
        <label>Altersklasse
          <select name="age" id="age"></select>
        </label>
        <fieldset class="levels">
          <legend>Niveau</legend>
          <div id="levels" class="segmented"></div>
        </fieldset>
        <label>Einheiten pro Woche
          <select name="sessions">
            <option value="1">1</option>
            <option value="2" selected>2</option>
            <option value="3">3</option>
          </select>
        </label>
        <label>Dauer (Minuten)
          <select name="minutes" id="minutes"></select>
        </label>
        <label>Anzahl Kinder
          <input type="number" name="players" min="2" max="40" value="12">
        </label>
        <label>Schwerpunkt
          <select name="theme" id="theme"></select>
        </label>
        <label>Kalenderwoche
          <input type="number" name="week" min="1" max="53">
        </label>
        <div class="actions">
          <button type="button" id="shuffle">Neu mischen</button>
          <button type="button" id="print">Drucken</button>
        </div>
      </form>
      <p id="level-hint" class="hint"></p>
      <div id="plan"></div>
    </section>

    <section id="view-catalog" class="view" hidden>
      <div class="controls compact">
        <label>Altersklasse
          <select id="cat-age"><option value="">Alle</option></select>
        </label>
        <label>Phase
          <select id="cat-phase"><option value="">Alle</option></select>
        </label>
        <label>Schwerpunkt
          <select id="cat-theme"><option value="">Alle</option></select>
        </label>
      </div>
      <p id="cat-count" class="hint"></p>
      <div id="catalog" class="catalog"></div>
    </section>

    <section id="view-rules" class="view" hidden>
      <div id="rules"></div>
    </section>
  </main>

  <footer class="site-footer wrap">
    <p>Grundlage: Horst Weins Funino und die DFB-Spielformen im Kinderfußball. Feldmaße sind Richtwerte.</p>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>

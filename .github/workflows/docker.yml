name: Docker image
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            # v1.0.0-u11 -> u11-latest (Variante aus dem Tag-Suffix)
            type=match,pattern=^v\d+\.\d+\.\d+-(.+)$,group=1,suffix=-latest
            type=sha,format=short
            type=ref,event=pr
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Bei einem Versions-Tag ein GitHub-Release anlegen. Der Titel kommt aus der
  # Nachricht des annotierten Tags (z. B. "1.0 (u11)"), sonst aus dem Tag-Namen.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          ref=$(gh api "repos/$REPO/git/ref/tags/$TAG")
          title="$TAG"
          if [ "$(jq -r .object.type <<<"$ref")" = tag ]; then
            msg=$(gh api "repos/$REPO/git/tags/$(jq -r .object.sha <<<"$ref")" --jq .message | head -n1)
            [ -n "$msg" ] && title="$msg"
          fi
          gh release view "$TAG" -R "$REPO" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$REPO" --title "$title" --generate-notes --verify-tag
